<div class="container mt-4">
  <h1>{{ 'subject.create.title' | transloco }}</h1>

  <form [formGroup]="subjectForm" (ngSubmit)="createSubject()">
    <div class="mb-3">
      <label for="name" class="form-label">{{ 'common.name' | transloco }}</label>
      <input type="text" id="name" formControlName="name" class="form-control">
      <div *ngIf="subjectForm.get('name')?.errors?.['maxlength'] && subjectForm.get('name')?.touched" class="alert alert-danger mt-2">
        {{ 'subject.create.nameMaxError' | transloco:{ max: nameMaxLength } }}
      </div>
      <div *ngIf="subjectForm.get('name')?.errors?.['minlength'] && subjectForm.get('name')?.touched" class="alert alert-danger mt-2">
        {{ 'subject.create.nameMinError' | transloco:{ min: charMinLength } }}
      </div>
    </div>

    <div class="mb-3">
      <label for="desc-editor" class="form-label">{{ 'common.description' | transloco }}</label>
      <div class="editor-toolbar">
        <button (click)="descEditor.chain().focus().toggleBold().run()"
          [class.btn-outline-secondary]="!descEditor.isActive('bold')"
          [class.btn-secondary]="descEditor.isActive('bold')"
          class="btn"
          type="button"><i class="bi bi-type-bold"></i></button>
        <button (click)="descEditor.chain().focus().toggleItalic().run()"
          [class.btn-outline-secondary]="!descEditor.isActive('italic')"
          [class.btn-secondary]="descEditor.isActive('italic')"
          class="btn"
          type="button"><i class="bi bi-type-italic"></i></button>
        <button (click)="descEditor.chain().focus().toggleStrike().run()"
          [class.btn-outline-secondary]="!descEditor.isActive('strike')"
          [class.btn-secondary]="descEditor.isActive('strike')"
          class="btn"
          type="button"><i class="bi bi-type-strikethrough"></i></button>
      </div>
      <tiptap-editor [editor]="descEditor" class="editorCustom"></tiptap-editor>
      <div *ngIf="descLength > descMaxLength" class="alert alert-danger mt-2">
        {{ 'subject.create.descMaxError' | transloco:{ max: descMaxLength, current: descLength } }}
      </div>
    </div>

    <div class="mb-3">
      <label for="icon" class="form-label">{{ 'common.icon' | transloco }}</label>
      <input type="file" id="icon" (change)="onFileSelected($event)" class="form-control">
    </div>

    <button type="submit" class="btn btn-primary">{{ 'subject.create.createButton' | transloco }}</button>
  </form>
</div>
<app-toast></app-toast>
