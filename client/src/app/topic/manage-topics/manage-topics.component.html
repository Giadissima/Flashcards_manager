<div class="container md">
  <div class="card">
    <div class="card-header p-4 d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center">
        <div class="header-icon-container me-3">
          <span class="material-symbols-outlined">
            cards_stack
          </span>
        </div>
        <div>
          <h2 class="card-title">Manage Topics</h2>
          <h6 class="card-subtitle mb-2 text-body-secondary">Organizza gli argomenti delle materie</h6>
        </div>
      </div>
      <button class="btn btn-primary d-flex align-items-center gap-2" (click)="createTopic()">
        <span>+</span> Nuovo argomento
      </button>
    </div>
    <div class="card-body">

      <div class="filter-bar mb-4">
        <div class="row align-items-center justify-content-between">

          <div class="col-md-6">
            <div class="input-group">
              <span class="input-group-text">Subject</span>
              <select class="form-select" [(ngModel)]="selectedSubjectId" (ngModelChange)="onFilterChange()">
                <option [ngValue]="null">All Subjects</option>
                @for (subject of subjects; track subject._id) {
                <option [value]="subject._id">{{ subject.name }}</option>
                }
              </select>
            </div>
          </div>

          <div class="col-md-5">
            <div class="input-group">
              <input type="text" id="searchFilter" class="form-control" placeholder="Search topics...">
              <span class="input-group-text search-icon">
                <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px"
                  fill="currentColor">
                  <path
                    d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z" />
                </svg>
              </span>
            </div>
          </div>

        </div>
      </div>

      <table class="table mt-3">
        <thead>
          <tr>
            <th>Name</th>
            <th>Color</th>
            <th>Subject</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (topic of topics; track topic._id) {
          <tr>
            <td>{{ topic.name }}</td>
            <td>
              <span [style.backgroundColor]="topic.color" class="color-preview"></span>
              {{ topic.color }}
            </td>
            <td>{{ getSubjectName(topic.subject_id) }}</td>
            <td>
              <button type="button" class="btn btn-outline-warning mx-1" (click)="editTopic(topic._id)">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                  fill="currentColor">
                  <path
                    d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t26 18l55 56q12 11 17.5 26t5.5 30q0 16-5.5 30.5T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z" />
                </svg>
              </button>
              <button type="button" class="btn btn-outline-danger mx-1" (click)="deleteTopic(topic._id)">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                  fill="currentColor">
                  <path
                    d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z" />
                </svg>
              </button>
            </td>
          </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
<app-toast></app-toast>
