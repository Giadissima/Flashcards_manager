<app-modal
  [(isOpen)]="isOpen"
  [dialogClass]="'image-modal-dialog'"
  [contentClass]="'image-modal-content'"
  (closed)="onClosed()"
>
  @if (src) {
  @if (loading) {
  <div class="image-modal-loading">
    <div class="spinner-border text-light" role="status">
      <span class="visually-hidden">{{ 'common.loading' | transloco }}</span>
    </div>
  </div>
  }
  <img #image [src]="src" alt="" class="image-modal-img" [class.image-modal-img-loading]="loading"
    (load)="onImageLoaded()" (error)="onImageLoaded()">
  <div class="image-modal-zoom-controls">
    <button type="button" class="btn btn-secondary btn-sm" (click)="zoomOut()" [attr.aria-label]="'common.zoomOut' | transloco">
      <span class="material-symbols-outlined">zoom_out</span>
    </button>
    <button type="button" class="btn btn-secondary btn-sm" (click)="resetZoom()" [attr.aria-label]="'common.zoomReset' | transloco">
      <span class="material-symbols-outlined">aspect_ratio</span>
    </button>
    <button type="button" class="btn btn-secondary btn-sm" (click)="zoomIn()" [attr.aria-label]="'common.zoomIn' | transloco">
      <span class="material-symbols-outlined">zoom_in</span>
    </button>
  </div>
  }
</app-modal>
