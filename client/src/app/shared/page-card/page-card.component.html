<div class="card">
  <div class="card-header p-4 d-flex flex-column flex-sm-row justify-content-between align-items-stretch align-items-sm-center gap-3">
    <div class="d-flex align-items-center">
      <div class="header-icon-container me-3">
        <span class="material-symbols-outlined">{{ icon }}</span>
      </div>
      <div class="page-card-heading">
        <h2 class="card-title">{{ title }}</h2>
        @if (subtitle) {
        <h6 class="card-subtitle mb-0 text-body-secondary">{{ subtitle }}</h6>
        }
      </div>
    </div>
    <!-- One flex item whatever it holds, so the header layout has a single
         thing to place and the phone rules below have a single target. -->
    <div class="card-action"><ng-content select="[card-actions]"></ng-content>@if (actionLabel) {
      @if (actionLink) {
      <a [routerLink]="actionLink" class="btn btn-primary d-inline-flex align-items-center gap-2">
        <span class="material-symbols-outlined">{{ actionIcon }}</span>{{ actionLabel }}
      </a>
      } @else {
      <button type="button" class="btn btn-primary d-inline-flex align-items-center gap-2" (click)="action.emit()">
        <span class="material-symbols-outlined">{{ actionIcon }}</span>{{ actionLabel }}
      </button>
      }
      }</div>
  </div>
  <div class="card-body" [ngClass]="bodyClass">
    <ng-content></ng-content>
  </div>
</div>
