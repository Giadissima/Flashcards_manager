<div class="segmented" role="group" [attr.aria-label]="label || null">
  @for (option of options; track option.value) {
  <button type="button" class="segmented-option" [class.segmented-option--active]="option.value === value"
    [attr.aria-pressed]="option.value === value" (click)="select(option)">
    {{ option.label }}@if (option.count !== undefined) {
    <span class="segmented-count">{{ option.count }}</span>
    }
  </button>
  }
</div>
