<!-- One bordered box around the icon and both fields, read left to right as one
     sentence ("publication, from this day to that one"), so the icon reads as
     labelling the whole control rather than just the select beside it. -->
<div class="date-range">
  @if (fields.length) {
  <app-searchable-select class="date-range-field" [options]="fields" [value]="field" [disabled]="disabled"
    [title]="'common.dateFieldLabel' | transloco" [attr.aria-label]="'common.dateFieldLabel' | transloco"
    (valueChange)="onField($event)"></app-searchable-select>
  }

  <!-- The far end limits the near one and the other way round, so the calendar
       itself cannot offer a range that runs backwards. -->
  <mat-form-field class="date-range-field-group" appearance="outline" subscriptSizing="dynamic">
    <mat-date-range-input [formGroup]="range" [rangePicker]="picker" [max]="today">
      <input matStartDate formControlName="start" [placeholder]="'common.dateFrom' | transloco"
        [attr.aria-label]="'common.dateFrom' | transloco">
      <input matEndDate formControlName="end" [placeholder]="'common.dateTo' | transloco"
        [attr.aria-label]="'common.dateTo' | transloco">
    </mat-date-range-input>
    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-date-range-picker #picker></mat-date-range-picker>
  </mat-form-field>

  @if (from || to) {
  <button type="button" class="btn btn-icon-ghost date-range-clear" [disabled]="disabled" (click)="clear()"
    [title]="'common.dateClear' | transloco" [attr.aria-label]="'common.dateClear' | transloco">
    <span class="material-symbols-outlined">close</span>
  </button>
  }
</div>
