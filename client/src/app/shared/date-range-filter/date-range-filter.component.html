<div class="date-range">
  <span class="material-symbols-outlined date-range-icon">date_range</span>

  <!-- In front of the two ends and not above them: read left to right it makes
       one sentence, "publication, from this day to that one". -->
  @if (fields.length) {
  <select class="form-select date-range-field" [disabled]="disabled"
    [title]="'common.dateFieldLabel' | transloco" [attr.aria-label]="'common.dateFieldLabel' | transloco"
    (change)="onField($any($event.target).value)">
    <!-- Marked on the option and not bound on the select: the value of a
         select is set before its options exist, and would find nothing to
         match on the first draw. -->
    @for (option of fields; track option.value) {
    <option [value]="option.value" [selected]="option.value === field">{{ option.label }}</option>
    }
  </select>
  }

  <!-- The far end limits the near one and the other way round, so the calendar
       itself cannot offer a range that runs backwards. -->
  <input type="date" class="form-control date-range-input" [value]="from ?? ''" [attr.max]="to || null"
    [disabled]="disabled" [title]="'common.dateFrom' | transloco" [attr.aria-label]="'common.dateFrom' | transloco"
    (change)="onFrom($any($event.target).value)">

  <span class="date-range-dash" aria-hidden="true">–</span>

  <input type="date" class="form-control date-range-input" [value]="to ?? ''" [attr.min]="from || null"
    [disabled]="disabled" [title]="'common.dateTo' | transloco" [attr.aria-label]="'common.dateTo' | transloco"
    (change)="onTo($any($event.target).value)">

  @if (from || to) {
  <button type="button" class="btn btn-icon-ghost date-range-clear" [disabled]="disabled" (click)="clear()"
    [title]="'common.dateClear' | transloco" [attr.aria-label]="'common.dateClear' | transloco">
    <span class="material-symbols-outlined">close</span>
  </button>
  }
</div>
