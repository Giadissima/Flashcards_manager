<div class="container-md">
  <app-load-state errorMessageKey="profile.loadError">
    <app-page-card icon="account_circle" [title]="'profile.title' | transloco"
      [subtitle]="'profile.subtitle' | transloco:{ username: username }">

      <app-study-fields [value]="studyFields" (valueChange)="studyFields = $event"></app-study-fields>

      <div class="form-actions">
        <button type="button" class="btn btn-primary" [disabled]="saving" (click)="save()">
          <span class="material-symbols-outlined">save</span>{{ 'profile.save' | transloco }}
        </button>
      </div>
    </app-page-card>
  </app-load-state>
</div>
