<nav>
  <!-- Sinistra: Logo + Nome progetto -->
  <a routerLink="/home" class="logo-container">
    <img src="assets/logo2.png" alt="Logo" class="logo">
    <span class="project-name">Flashcards Manager</span>
  </a>

  <!-- Centro: Menu -->
  <div class="menu-container">
    <div class="dropdown" (appClickOutside)="closeDropdown('topics')">
      <span class="menu-item" (click)="toggleDropdown('topics')">
        Topics
        <svg class="arrow-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
          fill="currentColor">
          <path d="M480-360 280-560h400L480-360Z" />
        </svg>
      </span>
      <div class="dropdown-content" [class.show]="openDropdown === 'topics'">
        <a routerLink="/create-topic" (click)="closeDropdown('topics')">Create Topic</a>
        <a routerLink="/manage-topics" (click)="closeDropdown('topics')">Manage Topics</a>
      </div>
    </div>
    <div class="dropdown" (appClickOutside)="closeDropdown('subjects')">
      <span class="menu-item" (click)="toggleDropdown('subjects')">
        Subjects
        <svg class="arrow-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
          fill="currentColor">
          <path d="M480-360 280-560h400L480-360Z" />
        </svg>
      </span>
      <div class="dropdown-content" [class.show]="openDropdown === 'subjects'">
        <a routerLink="/create-subject" (click)="closeDropdown('subjects')">New Subject</a>
        <a routerLink="/manage-subjects" (click)="closeDropdown('subjects')">Manage Subjects</a>
      </div>
    </div>
    <div class="dropdown" (appClickOutside)="closeDropdown('test')">
      <span class="menu-item" (click)="toggleDropdown('test')">
        Test
        <svg class="arrow-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
          fill="currentColor">
          <path d="M480-360 280-560h400L480-360Z" />
        </svg>
      </span>
      <div class="dropdown-content" [class.show]="openDropdown === 'test'">
        <a routerLink="/setup-test" (click)="closeDropdown('test')">Start Test</a>
        <a routerLink="/test-result" (click)="closeDropdown('test')">Results</a>
      </div>
    </div>
  </div>

  <!-- Destra: Pulsante crea card e switch tema -->
  <div class="actions-container">
    <button routerLink="/create-card" type="button" class="btn btn-primary">
      <span>+</span>
      Create Card
    </button>
    <button (click)="openSettings()" class="theme-switch-btn" type="button" aria-label="Settings">
      <span class="material-symbols-outlined">settings</span>
    </button>
  </div>
</nav>

<app-settings-modal [(isOpen)]="isSettingsOpen" (openImportExport)="onOpenImportExportFromSettings()"></app-settings-modal>
<app-import-export-modal [(isOpen)]="isImportExportOpen" (back)="onImportExportBack()"></app-import-export-modal>
