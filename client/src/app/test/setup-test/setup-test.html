<div class="container md">
  <div class="card">
    <div class="card-header p-4 d-flex align-items-center">
      <div class="header-icon-container me-3">
        <span class="material-symbols-outlined">quiz</span>
      </div>
      <div>
        <h2 class="card-title">Nuovo Test</h2>
        <h6 class="card-subtitle mb-0 text-body-secondary">Scegli materia, argomento e numero di domande</h6>
      </div>
    </div>
    <div class="card-body p-4">
      <form [formGroup]="testForm" (ngSubmit)="startTest()" novalidate>
        <div class="mb-3">
          <label class="form-label">Subject</label>
          <app-searchable-select
            [options]="subjectOptions"
            [value]="testForm.get('subject_id')?.value"
            allOptionLabel="Any subject"
            placeholder="Any subject"
            (valueChange)="onSubjectSelected($event)"
          ></app-searchable-select>
        </div>

        <div class="mb-3">
          <label class="form-label">Topic</label>
          <app-searchable-select
            [options]="topicOptions"
            [value]="testForm.get('topic_id')?.value"
            allOptionLabel="Any topic"
            placeholder="Any topic"
            (valueChange)="onTopicSelected($event)"
          ></app-searchable-select>
        </div>

        <div class="mb-3">
          <label for="numFlashcard" class="form-label">Number of questions</label>
          <input type="number" id="numFlashcard" formControlName="numFlashcard" class="form-control" max="50">
        </div>

        <div *ngIf="testForm.get('numFlashcard')?.errors?.['max'] && testForm.get('numFlashcard')?.touched" class="alert alert-danger">
          Puoi richiedere al massimo 50 domande. Inserisci un numero più basso.
        </div>

        <div *ngIf="testForm.errors?.['atLeastOneRequired'] && (testForm.touched || testForm.dirty)" class="alert alert-danger">
          Please select at least a subject or a topic.
        </div>

        <div class="d-flex justify-content-center mt-4">
          <button type="submit" class="btn btn-primary d-flex align-items-center gap-2" [disabled]="testForm.invalid">
            <span class="material-symbols-outlined">play_arrow</span>
            Start Test
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
