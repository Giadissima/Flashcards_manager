<div class="container md" *transloco="let t">
  <div class="card">
    <div class="card-header p-4 d-flex align-items-center">
      <div class="header-icon-container me-3">
        <span class="material-symbols-outlined">quiz</span>
      </div>
      <div>
        <h2 class="card-title">{{ 'test.setup.title' | transloco }}</h2>
        <h6 class="card-subtitle mb-0 text-body-secondary">{{ 'test.setup.subtitle' | transloco }}</h6>
      </div>
    </div>
    <div class="card-body p-4">
      <form [formGroup]="testForm" (ngSubmit)="startTest()" novalidate>
        <div class="mb-3">
          <label class="form-label">{{ 'test.setup.subjectLabel' | transloco }}</label>
          <app-searchable-select
            [options]="subjectOptions"
            [value]="testForm.get('subject_id')?.value"
            [allOptionLabel]="t('test.setup.anySubject')"
            [placeholder]="t('test.setup.anySubject')"
            (valueChange)="onSubjectSelected($event)"
          ></app-searchable-select>
        </div>

        <div class="mb-3">
          <label class="form-label">{{ 'test.setup.topicLabel' | transloco }}</label>
          <app-searchable-select
            [options]="topicOptions"
            [value]="testForm.get('topic_id')?.value"
            [allOptionLabel]="t('test.setup.anyTopic')"
            [placeholder]="t('test.setup.anyTopic')"
            (valueChange)="onTopicSelected($event)"
          ></app-searchable-select>
        </div>

        <div class="mb-3">
          <label for="numFlashcard" class="form-label">{{ 'test.setup.numQuestionsLabel' | transloco }}</label>
          <input type="number" id="numFlashcard" formControlName="numFlashcard" class="form-control" max="50">
        </div>

        <div *ngIf="testForm.get('numFlashcard')?.errors?.['max'] && testForm.get('numFlashcard')?.touched" class="alert alert-danger">
          {{ 'test.setup.maxQuestionsError' | transloco }}
        </div>

        <div *ngIf="testForm.errors?.['atLeastOneRequired'] && (testForm.touched || testForm.dirty)" class="alert alert-danger">
          {{ 'test.setup.atLeastOneError' | transloco }}
        </div>

        <div class="d-flex justify-content-center mt-4">
          <button type="submit" class="btn btn-primary d-flex align-items-center gap-2" [disabled]="testForm.invalid">
            <span class="material-symbols-outlined">play_arrow</span>
            {{ 'test.setup.startButton' | transloco }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
