<app-load-state errorMessageKey="test.runner.getTestError" notFoundMessageKey="common.error.testNotFound">
<div class="container test-runner-container mt-4" *transloco="let t">
  <!-- Pause acts on the clock and on nothing else, so it lives on the clock:
       the run stays on screen and the same button starts the time again. The
       actions that leave the page are the two at the bottom. -->
  <div class="test-timer-slot">
    <div class="test-timer" [class.test-timer--paused]="isPaused">
      <span class="material-symbols-outlined test-timer-icon">timer</span>
      <span class="test-timer-value">{{ elapsed_time | duration }}</span>
      <button type="button" class="test-timer-pause btn"
        [attr.aria-label]="isPaused ? t('test.runner.resume') : t('test.runner.pause')"
        (click)="togglePause()">
        <span class="material-symbols-outlined">{{ isPaused ? 'play_arrow' : 'pause' }}</span>
      </button>
    </div>
  </div>

  <app-page-card icon="quiz" [title]="subjectName"
    [subtitle]="testStartDate ? t('test.runner.startedOn') + ' ' + (testStartDate | date:'dd/MM/yyyy HH:mm') : ''"
    bodyClass="p-4">
    <!-- The number checked most often during a run, so it is the first thing in
         the body and it is drawn, not only counted. -->
    <div class="test-progress mb-4">
      <div class="test-progress-label">
        <span>{{ 'test.runner.progress' | transloco:{ answered: answeredCount, total: totalCount } }}</span>
        <span class="test-progress-percent">{{ progressPercent }}%</span>
      </div>
      <div class="test-progress-track" role="progressbar" [attr.aria-valuenow]="answeredCount" aria-valuemin="0"
        [attr.aria-valuemax]="totalCount">
        <div class="test-progress-fill" [style.width.%]="progressPercent"></div>
      </div>
    </div>

    <div class="d-flex flex-column">
    @for (card of pageFlashcards; track card._id) {
    <div class="card flashcard flashcard-topic-color mb-3" [style.border-top-color]="getCardColor(card)"
      [class.card--correct]="isCorrectAnswer(card) === true"
      [class.card--incorrect]="isCorrectAnswer(card) === false">
      <div class="flashcard-title">
        <img [src]="getCardSubjectIconUrl(card)" alt="" class="flashcard-subject-icon">
        <div>
          <h5 class="card-title mb-0">{{ card.title }}</h5>
          <div class="flashcard-meta text-muted">{{ getCardSubjectName(card) }} · {{ getCardTopicName(card) }}</div>
        </div>
      </div>
      <div class="flashcard-body">
        <div class="flashcard-text" [innerHTML]="getCardBody(card) | katexRenderer" (zoomableImages)="lightbox.open($event)"></div>
        <div class="flashcard-actions">
          <button type="button" class="btn btn-primary btn-with-icon" (click)="seeAnswer(card)">
            <span class="material-symbols-outlined">visibility</span>
            {{ getCardButtonText(card) }}
          </button>
          <button type="button" class="icon-wrapper btn" [class.btn-outline-secondary]="isCorrectAnswer(card) !== true"
            [class.btn-success]="isCorrectAnswer(card) === true" (click)="setAnswer(card, true)">
            <span class="material-symbols-outlined">
              check
            </span>
          </button>
          <button type="button" class="icon-wrapper btn" [class.btn-outline-secondary]="isCorrectAnswer(card) !== false"
            [class.btn-danger]="isCorrectAnswer(card) === false" (click)="setAnswer(card, false)">
            <span class="material-symbols-outlined">
              close
            </span>
          </button>
        </div>
      </div>
    </div>
    }
    </div>

    <app-pagination [currentPage]="currentPage" [totalPages]="totalPages"
      (previous)="previousPage()" (next)="nextPage()"></app-pagination>

    <div class="d-flex justify-content-center gap-2 mt-4">
      <button type="button" class="btn btn-outline-secondary btn-with-icon" (click)="exitTest()"><span class="material-symbols-outlined">logout</span>{{ 'test.runner.exit' |
        transloco }}</button>
      <button type="button" class="btn btn-primary btn-with-icon" id="finishTest" (click)="requestFinish()"><span class="material-symbols-outlined">flag</span>{{ 'test.runner.endTest' |
        transloco }}</button>
    </div>
  </app-page-card>
</div>
</app-load-state>

<ng-container *transloco="let t">
  <app-confirm-dialog [isOpen]="showFinishConfirm" [title]="t('test.runner.endConfirmTitle')"
    [message]="finishConfirmMessage" [confirmLabel]="t('test.runner.endTest')" [cancelLabel]="t('common.cancel')"
    (confirmed)="confirmFinish()" (cancelled)="cancelFinish()"></app-confirm-dialog>
</ng-container>
<app-image-lightbox #lightbox></app-image-lightbox>
