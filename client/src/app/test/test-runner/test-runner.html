<div class="container mt-4" *transloco="let t">
  <div class="icons-wrapper" [class.timer-over-hour]="elapsed_time >= 3600">
    <div class="circle-wrapper timer-icon">
      <span class="material-symbols-outlined">timer</span>
      <span>
        {{elapsed_time | duration}}
      </span>
    </div>
    <div class="circle-wrapper pause-play-icon btn">
      <span class="material-symbols-outlined">pause</span>
    </div>
  </div>
  <div class="d-flex flex-column align-items-center">
    <h1>Ricerca operativa</h1>
    @for (card of pageFlashcards; track card._id) {
    <div class="card flashcard flashcard-topic-color mb-3" [style.border-top-color]="getCardColor(card)">
      <div class="flashcard-title d-flex align-items-center justify-content-center gap-2">
        <img [src]="getCardSubjectIconUrl(card)" alt="" class="flashcard-subject-icon">
        <div>
          <h5 class="card-title mb-0">{{ card.title }}</h5>
          <div class="flashcard-meta text-muted">{{ getCardSubjectName(card) }} · {{ getCardTopicName(card) }}</div>
        </div>
      </div>
            <div class="flashcard-body d-flex flex-column align-items-center text-center">
        <div class="flashcard-text" [innerHTML]="getCardBody(card) | katexRenderer"></div>
        <div class="flashcard-actions justify-content-center">
          <button type="button" class="btn btn-primary" (click)="seeAnswer(card)">
            {{ getCardButtonText(card) }}
          </button>
          <button type="button" class="icon-wrapper btn"
            [class.btn-outline-secondary]="isCorrectAnswer(card) !== true"
            [class.btn-primary]="isCorrectAnswer(card) === true" (click)="setAnswer(card, true)">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px">
              <path
                d="m424-296 282-282-56-56-226 226-114-114-56 56 170 170Zm56 216q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z" />
            </svg>
          </button>
          <button type="button" class="icon-wrapper btn"
            [class.btn-outline-secondary]="isCorrectAnswer(card) !== false"
            [class.btn-danger]="isCorrectAnswer(card) === false" (click)="setAnswer(card, false)">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px">
              <path
                d="m336-280 144-144 144 144 56-56-144-144 144-144-56-56-144 144-144-144-56 56 144 144-144 144 56 56ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z" />
            </svg>
          </button>
        </div>
      </div>
    </div>
    }
  </div>

  <div class="d-flex justify-content-between align-items-center mt-4">
    <button type="button" class="btn" (click)="previousPage()" [disabled]="currentPage === 1">{{ 'common.previous' |
      transloco }}</button>
    <span>{{ 'common.pageOf' | transloco:{ current: currentPage, total: totalPages } }}</span>
    <button type="button" class="btn" (click)="nextPage()" [disabled]="currentPage >= totalPages">{{ 'common.next' |
      transloco }}</button>
  </div>

  <div class="d-flex justify-content-center gap-2 mt-4">
    <button type="button" class="btn btn-outline-primary" (click)="requestGoHome()">{{ 'test.runner.backHome' |
      transloco }}</button>
    <button type="button" class="btn btn-outline-secondary" (click)="requestPause()">{{ 'test.runner.pause' | transloco
      }}</button>
    <button type="button" class="btn btn-primary" id="finishTest" (click)="finishTest()">{{ 'test.runner.endTest' |
      transloco }}</button>
  </div>
</div>

<ng-container *transloco="let t">
  <app-confirm-dialog [isOpen]="showLeaveConfirm" [title]="t('test.runner.leaveConfirmTitle')"
    [message]="t('test.runner.leaveConfirmMessage')" [confirmLabel]="t('common.yes')" [cancelLabel]="t('common.cancel')"
    (confirmed)="confirmLeave()" (cancelled)="cancelLeave()"></app-confirm-dialog>
</ng-container>
