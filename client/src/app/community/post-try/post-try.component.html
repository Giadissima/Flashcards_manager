<app-load-state errorMessageKey="community.try.error" notFoundMessageKey="common.error.testNotFound">
<div class="container post-try-container mt-4" *transloco="let t">
  <app-page-card icon="quiz" [iconUrl]="subjectIconUrl" [title]="subjectName" [subtitle]="t('community.try.subtitle')"
    bodyClass="p-4">
    <div class="test-progress mb-4">
      <div class="test-progress-label">
        <span>{{ 'test.runner.progress' | transloco:{ answered: answeredCount, total: totalCount } }}</span>
        <span class="test-progress-percent">{{ progressPercent }}%</span>
      </div>
      <div class="test-progress-track" role="progressbar" [attr.aria-valuenow]="answeredCount" aria-valuemin="0"
        [attr.aria-valuemax]="totalCount">
        <div class="test-progress-fill" [style.width.%]="progressPercent"></div>
      </div>
    </div>

    <div class="d-flex flex-column">
    @for (card of pageFlashcards; track card._id) {
    <div class="card flashcard flashcard-topic-color mb-3" [style.border-top-color]="getCardColor(card)"
      [class.card--correct]="isCorrectAnswer(card) === true"
      [class.card--incorrect]="isCorrectAnswer(card) === false">
      <div class="flashcard-title">
        <div>
          <h5 class="card-title mb-0">{{ card.title }}</h5>
          <div class="flashcard-meta text-muted">{{ getCardTopicName(card) }}</div>
        </div>
      </div>
      <div class="flashcard-body">
        <div class="flashcard-text" [innerHTML]="getCardBody(card) | katexRenderer" (zoomableImages)="lightbox.open($event)"></div>
        <div class="flashcard-actions">
          <button type="button" class="btn btn-primary" (click)="seeAnswer(card)">
            <span class="material-symbols-outlined">visibility</span>
            {{ getCardButtonText(card) }}
          </button>
          <button type="button" class="icon-wrapper btn" [class.btn-outline-secondary]="isCorrectAnswer(card) !== true"
            [class.btn-success]="isCorrectAnswer(card) === true" (click)="setAnswer(card, true)">
            <span class="material-symbols-outlined">check</span>
          </button>
          <button type="button" class="icon-wrapper btn" [class.btn-outline-secondary]="isCorrectAnswer(card) !== false"
            [class.btn-danger]="isCorrectAnswer(card) === false" (click)="setAnswer(card, false)">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
      </div>
    </div>
    }
    </div>

    <app-pagination [currentPage]="currentPage" [totalPages]="totalPages"
      (previous)="previousPage()" (next)="nextPage()"></app-pagination>

    @if (answeredCount > 0) {
    <p class="try-score text-center mt-3">{{ scoreMessage }}</p>
    }

    <div class="d-flex justify-content-center mt-4">
      <button type="button" class="btn btn-outline-secondary" (click)="exitTry()">
        <span class="material-symbols-outlined">logout</span>{{ 'community.try.exit' | transloco }}
      </button>
    </div>
  </app-page-card>
</div>
</app-load-state>
<app-image-lightbox #lightbox></app-image-lightbox>
