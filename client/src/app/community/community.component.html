<!-- The transloco pipe and not the structural directive: the directive puts
     everything under it into an embedded view, where the static ViewChild that
     starts the load no longer finds app-load-state and the spinner never ends.
     Elsewhere app-load-state sits outside the directive; here it is nested in
     the card, so the pipe is what keeps the header on screen while loading. -->
<div class="container-md">
  <app-page-card icon="diversity_3" [title]="'community.title' | transloco"
    [subtitle]="'community.subtitle' | transloco">
    <app-filter-bar [activeCount]="activeFilterCount" appearance="inset"
      [caption]="'common.filters' | transloco">
      <div class="row gy-3 gx-3">
        <div class="col-12 col-lg">
          <app-search-input [value]="searchTerm" [placeholder]="'community.searchPlaceholder' | transloco"
            inputId="communitySearch" (valueChange)="onSearchTermChange($event)"></app-search-input>
        </div>
        <div class="col-12 col-lg-auto">
          <!-- The feed has two dates and the filter has to say which one it
               is reading: a post shared in March and last added to in June
               answers "March" or "June" depending on nothing the two date
               boxes show on their own. -->
          <app-date-range-filter [from]="dateFrom" [to]="dateTo" [field]="dateField" [fields]="[
              { value: 'created', label: ('community.dateCreated' | transloco) },
              { value: 'updated', label: ('community.dateUpdated' | transloco) }
            ]" (rangeChange)="onDateRangeChange($event)"
            (fieldChange)="onDateFieldChange($event)"></app-date-range-filter>
        </div>
        <!-- Set to the reader's own university and course to begin with: the
             feed is worth most where they study, and the whole of it is one
             choice away in the same two dropdowns. -->
        <div class="col-12">
          <app-study-fields variant="filter" [value]="study"
            (valueChange)="onStudyChange($event)"></app-study-fields>
        </div>
      </div>
    </app-filter-bar>

    <app-segmented-filter [options]="[
        { value: 'created', label: ('community.sortCreated' | transloco) },
        { value: 'updated', label: ('community.sortUpdated' | transloco) },
        { value: 'popular', label: ('community.sortPopular' | transloco) }
      ]" [value]="sort" [label]="'community.sortLabel' | transloco" (valueChange)="onSortChange($event)">
    </app-segmented-filter>

    <app-load-state errorMessageKey="community.loadError">
      @for (post of posts; track post._id) {
      <app-post-card [post]="post"></app-post-card>
      } @empty {
      <p class="community-empty">{{ 'community.empty' | transloco }}</p>
      }

      @if (totalPages > 1) {
      <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" (previous)="previousPage()"
        (next)="nextPage()"></app-pagination>
      }
    </app-load-state>
  </app-page-card>
</div>
