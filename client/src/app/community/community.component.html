<!-- The transloco pipe and not the structural directive: the directive puts
     everything under it into an embedded view, where the static ViewChild that
     starts the load no longer finds app-load-state and the spinner never ends.
     Elsewhere app-load-state sits outside the directive; here it is nested in
     the card, so the pipe is what keeps the header on screen while loading. -->
<div class="container-md">
  <app-page-card icon="diversity_3" [title]="'community.title' | transloco"
    [subtitle]="'community.subtitle' | transloco">
    <app-segmented-filter [options]="[
        { value: 'created', label: ('community.sortCreated' | transloco) },
        { value: 'updated', label: ('community.sortUpdated' | transloco) },
        { value: 'popular', label: ('community.sortPopular' | transloco) }
      ]" [value]="sort" [label]="'community.sortLabel' | transloco" (valueChange)="onSortChange($event)">
    </app-segmented-filter>

    <app-date-range-filter class="feed-dates" [from]="dateFrom" [to]="dateTo"
      (rangeChange)="onDateRangeChange($event)"></app-date-range-filter>

    <app-load-state errorMessageKey="community.loadError">
      @for (post of posts; track post._id) {
      <app-post-card [post]="post"></app-post-card>
      } @empty {
      <p class="community-empty">{{ 'community.empty' | transloco }}</p>
      }

      @if (totalPages > 1) {
      <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" (previous)="previousPage()"
        (next)="nextPage()"></app-pagination>
      }
    </app-load-state>
  </app-page-card>
</div>
