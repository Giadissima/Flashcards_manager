<app-load-state errorMessageKey="home.toast.flashcardsLoadError">
<div class="container mt-4" *transloco="let t">
  <app-filter-bar [activeCount]="activeFilterCount" [caption]="t('common.filters')">
    <div class="row gy-2 gx-3 align-items-center">
      <div class="col-12 col-sm-auto">
        <label class="visually-hidden">{{ 'common.subject' | transloco }}</label>
        <app-searchable-select
          [options]="subjectOptions"
          [value]="selectedSubjectId"
          [allOptionLabel]="t('common.allSubjects')"
          [placeholder]="t('common.allSubjects')"
          [disabled]="isReloading"
          (valueChange)="onSubjectSelected($event)"
        ></app-searchable-select>
      </div>
      <div class="col-12 col-sm-auto">
        <label class="visually-hidden">{{ 'common.topic' | transloco }}</label>
        <app-searchable-select
          [options]="topicOptions"
          [value]="selectedTopicId"
          [allOptionLabel]="t('common.allTopics')"
          [placeholder]="t('common.allTopics')"
          [disabled]="isReloading"
          (valueChange)="onTopicSelected($event)"
        ></app-searchable-select>
      </div>
      <div class="col-12 col-sm-auto">
        <app-search-input
          [value]="searchTerm"
          [placeholder]="t('home.searchPlaceholder')"
          [disabled]="isReloading"
          (valueChange)="onSearchTermChange($event)"
        ></app-search-input>
      </div>
      <div class="col-12 col-sm-auto">
        <div class="btn-group" role="group">
          <button type="button" class="btn" (click)="setSortBy('title')"
            [class.btn-primary]="sortBy === 'title' && !isReloading" [class.btn-outline-primary]="sortBy !== 'title' && !isReloading"
            [class.btn-secondary]="sortBy === 'title' && isReloading" [class.btn-outline-secondary]="sortBy !== 'title' && isReloading"
            [disabled]="isReloading">
            {{ 'home.sortName' | transloco }}
            @if (sortBy === 'title') {
            @if (sortDirection === 'desc') {
            <span class="material-symbols-outlined">arrow_upward</span>
            } @else {
            <span class="material-symbols-outlined">arrow_downward</span>
            }
            }
          </button>
          <button type="button" class="btn" (click)="setSortBy('createdAt')"
            [class.btn-primary]="sortBy === 'createdAt' && !isReloading" [class.btn-outline-primary]="sortBy !== 'createdAt' && !isReloading"
            [class.btn-secondary]="sortBy === 'createdAt' && isReloading" [class.btn-outline-secondary]="sortBy !== 'createdAt' && isReloading"
            [disabled]="isReloading">
            {{ 'home.sortDate' | transloco }}
            @if (sortBy === 'createdAt') {
            @if (sortDirection === 'desc') {
            <span class="material-symbols-outlined">arrow_upward</span>
            } @else {
            <span class="material-symbols-outlined">arrow_downward</span>
            }
            }
          </button>
        </div>
      </div>
    </div>
  </app-filter-bar>

  <div class="flashcard-grid-wrapper">
    @if (isReloading) {
    <div class="flashcard-grid-overlay">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">{{ 'common.loading' | transloco }}</span>
      </div>
    </div>
    }
    <div class="flashcard-grid">
    @for (card of flashcards; track card._id) {
    <div class="card flashcard flashcard-topic-color" [style.border-top-color]="getCardColor(card)">
      <div class="flashcard-title">
        <img [src]="getCardSubjectIconUrl(card)" alt="" class="flashcard-subject-icon">
        <div>
          <h5 class="card-title mb-0">{{ card.title }}</h5>
          <div class="flashcard-meta text-muted">{{ getCardSubjectName(card) }} · {{ getCardTopicName(card) }}</div>
        </div>
      </div>
      <div class="flashcard-body">
        <div class="flashcard-text" [class.is-clamped]="isClamped(card)" [class.is-cut]="isCut(card)"
          [innerHTML]="getCardBody(card) | katexRenderer" (zoomableImages)="lightbox.open($event)"
          (contentOverflow)="onContentOverflow(card, $event)"></div>
        @if (canExpand(card)) {
        <button type="button" class="btn btn-link flashcard-expand" (click)="toggleExpanded(card)">
          {{ (isExpanded(card) ? 'home.collapse' : 'home.expand') | transloco }}
        </button>
        }
        <div class="flashcard-actions">
          <button class="btn btn-primary btn-with-icon" (click)="seeAnswer(card)">
            <span class="material-symbols-outlined">visibility</span>
            {{ getCardButtonText(card) }}
          </button>
          <button type="button" class="btn btn-icon-ghost btn-danger-hover" (click)="deleteCard(card)">
            <span class="material-symbols-outlined">delete</span>
          </button>
          <button type="button" class="btn btn-icon-ghost" (click)="modifyCard(card)">
            <span class="material-symbols-outlined">edit</span>
          </button>
          <button type="button" class="btn btn-icon-ghost" (click)="copyCard(card)">
            <span class="material-symbols-outlined">content_copy</span>
          </button>
        </div>
      </div>
    </div>
    }
    </div>
  </div>

  <app-pagination [currentPage]="currentPage" [totalPages]="totalPages"
    [disabled]="isReloading"
    (previous)="previousPage()" (next)="nextPage()"></app-pagination>
</div>
</app-load-state>

<app-image-lightbox #lightbox></app-image-lightbox>

<app-toast></app-toast>
