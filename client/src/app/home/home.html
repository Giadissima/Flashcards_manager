<div class="container" *transloco="let t">
  <div class="filter-bar mb-4">
    <div class="row gy-2 gx-3 align-items-center">
      <div class="col-auto">
        <label class="visually-hidden">{{ 'common.subject' | transloco }}</label>
        <app-searchable-select
          [options]="subjectOptions"
          [value]="selectedSubjectId"
          [allOptionLabel]="t('common.allSubjects')"
          [placeholder]="t('common.allSubjects')"
          (valueChange)="onSubjectSelected($event)"
        ></app-searchable-select>
      </div>
      <div class="col-auto">
        <label class="visually-hidden">{{ 'common.topic' | transloco }}</label>
        <app-searchable-select
          [options]="topicOptions"
          [value]="selectedTopicId"
          [allOptionLabel]="t('common.allTopics')"
          [placeholder]="t('common.allTopics')"
          (valueChange)="onTopicSelected($event)"
        ></app-searchable-select>
      </div>
      <div class="col-auto">
        <app-search-input
          [value]="searchTerm"
          [placeholder]="t('home.searchPlaceholder')"
          (valueChange)="onSearchTermChange($event)"
        ></app-search-input>
      </div>
      <div class="col-auto">
        <div class="btn-group" role="group">
          <button type="button" class="btn btn-outline-primary border-bootstrap-btn-custom" (click)="setSortBy('title')"
            [class.active]="sortBy === 'title'">
            {{ 'home.sortName' | transloco }}
            @if (sortBy === 'title') {
            @if (sortDirection === 'desc') {
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
              fill="currentColor">
              <path d="M440-160v-487L216-423l-56-57 320-320 320 320-56 57-224-224v487h-80Z" />
            </svg>
            } @else {
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
              fill="currentColor">
              <path d="M440-800v487L216-537l-56 57 320 320 320-320-56-57-224 224v-487h-80Z" />
            </svg>
            }
            }
          </button>
          <button type="button" class="btn btn-outline-primary border-bootstrap-btn-custom"
            (click)="setSortBy('createdAt')" [class.active]="sortBy === 'createdAt'">
            {{ 'home.sortDate' | transloco }}
            @if (sortBy === 'createdAt') {
            @if (sortDirection === 'desc') {
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
              fill="currentColor">
              <path d="M440-160v-487L216-423l-56-57 320-320 320 320-56 57-224-224v487h-80Z" />
            </svg>
            } @else {
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
              fill="currentColor">
              <path d="M440-800v487L216-537l-56 57 320 320 320-320-56-57-224 224v-487h-80Z" />
            </svg>
            }
            }
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="flashcard-grid">
    @for (card of flashcards; track card._id) {
    <div class="card flashcard flashcard-topic-color" [style.border-top-color]="getCardColor(card)">
      <div class="flashcard-title d-flex align-items-center gap-2">
        <img [src]="getCardSubjectIconUrl(card)" alt="" class="flashcard-subject-icon">
        <div>
          <h5 class="card-title mb-0">{{ card.title }}</h5>
          <div class="flashcard-meta text-muted">{{ getCardSubjectName(card) }} · {{ getCardTopicName(card) }}</div>
        </div>
      </div>
      <div class="flashcard-body">
        <div class="flashcard-text" [innerHTML]="getCardBody(card) | katexRenderer" (click)="onFlashcardTextClick($event)"></div>
        <div class="flashcard-actions">
          <button class="btn btn-primary" (click)="seeAnswer(card)">
            {{ getCardButtonText(card) }}
          </button>
          <button type="button" class="btn btn-outline-danger" (click)="deleteCard(card)">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
              fill="currentColor">
              <path
                d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z" />
            </svg>
          </button>
          <button type="button" class="btn btn-outline-warning" (click)="modifyCard(card)">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
              fill="currentColor">
              <path
                d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t26 18l55 56q12 11 17.5 26t5.5 30q0 16-5.5 30.5T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z" />
            </svg>
          </button>
          <button type="button" class="btn btn-outline-success" (click)="copyCard(card)">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
              fill="currentColor">
              <path
                d="M360-240q-33 0-56.5-23.5T280-320v-480q0-33 23.5-56.5T360-880h360q33 0 56.5 23.5T800-800v480q0 33-23.5 56.5T720-240H360Zm0-80h360v-480H360v480ZM200-80q-33 0-56.5-23.5T120-160v-560h80v560h440v80H200Zm160-240v-480 480Z" />
            </svg>
          </button>
        </div>
      </div>
    </div>
    }
  </div>

  <div class="d-flex justify-content-between align-items-center mt-4">
    <button type="button" class="btn" (click)="previousPage()" [disabled]="currentPage === 1">{{ 'common.previous' | transloco }}</button>
    <span>{{ 'common.pageOf' | transloco:{ current: currentPage, total: totalPages } }}</span>
    <button type="button" class="btn" (click)="nextPage()" [disabled]="currentPage >= totalPages">{{ 'common.next' | transloco }}</button>
  </div>
</div>

<app-modal
  [(isOpen)]="isImageModalOpen"
  [dialogClass]="'image-modal-dialog'"
  [contentClass]="'image-modal-content'"
  (closed)="onImageModalClosed()"
>
  @if (selectedImageUrl) {
  <img #imageModalImg [src]="selectedImageUrl" alt="" class="image-modal-img">
  <div class="image-modal-zoom-controls">
    <button type="button" class="btn btn-light btn-sm" (click)="zoomOut()" [attr.aria-label]="'home.zoomOut' | transloco">
      <i class="bi bi-zoom-out"></i>
    </button>
    <button type="button" class="btn btn-light btn-sm" (click)="resetZoom()" [attr.aria-label]="'home.zoomReset' | transloco">
      <i class="bi bi-aspect-ratio"></i>
    </button>
    <button type="button" class="btn btn-light btn-sm" (click)="zoomIn()" [attr.aria-label]="'home.zoomIn' | transloco">
      <i class="bi bi-zoom-in"></i>
    </button>
  </div>
  }
</app-modal>

<app-toast></app-toast>
