<!-- The reason comes first: nobody filling this in can guess what the two
     fields buy them, and left unexplained they get skipped. -->
<div class="study-callout">
  <span class="material-symbols-outlined">diversity_3</span>
  <div>
    <strong>{{ 'studyFields.why' | transloco }}</strong>
    <p class="mb-0">{{ 'studyFields.whyText' | transloco }}</p>
  </div>
</div>

<div class="form-group">
  <label class="form-label">{{ 'studyFields.university' | transloco }}</label>
  <app-searchable-select [options]="universityOptions" [value]="universityCode"
    [placeholder]="'studyFields.universityPlaceholder' | transloco"
    [allOptionLabel]="'studyFields.clear' | transloco"
    (valueChange)="onUniversityChange($event)"></app-searchable-select>
</div>

<div class="form-group">
  <label class="form-label">{{ 'studyFields.course' | transloco }}</label>
  <app-searchable-select [options]="courseOptions" [value]="courseValue"
    [disabled]="!universityCode || loadingCourses || universityHasNoCourses"
    [placeholder]="(!universityCode ? 'studyFields.coursePlaceholderLocked'
      : loadingCourses ? 'common.loading'
      : universityHasNoCourses ? 'studyFields.noCoursesAvailable'
      : 'studyFields.coursePlaceholder') | transloco"
    [allOptionLabel]="'studyFields.clear' | transloco"
    (valueChange)="onCourseChange($event)"></app-searchable-select>
  @if (universityHasNoCourses) {
  <div class="form-text">{{ 'studyFields.noCoursesHint' | transloco }}</div>
  }
</div>
