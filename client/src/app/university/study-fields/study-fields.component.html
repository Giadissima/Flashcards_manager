<!-- The reason comes first: nobody filling this in can guess what the two
     fields buy them, and left unexplained they get skipped. A filter needs
     none of it: there the two dropdowns are the answer, not the question. -->
@if (variant === 'form') {
<div class="study-callout">
  <span class="material-symbols-outlined">diversity_3</span>
  <div>
    <strong>{{ 'studyFields.why' | transloco }}</strong>
    <p class="mb-0">{{ 'studyFields.whyText' | transloco }}</p>
  </div>
</div>
}

<div class="study-fields" [class.is-filter]="variant === 'filter'">
  <div class="form-group">
    <label class="form-label">{{ 'studyFields.university' | transloco }}</label>
    <app-search-input [inputId]="'universityCityFilter'" [value]="cityFilter" [disabled]="loadingUniversities"
      [placeholder]="'studyFields.cityFilterPlaceholder' | transloco"
      (valueChange)="cityFilter = $event" (search)="onCityFilterChange($event)"></app-search-input>
    <app-searchable-select [options]="universityOptions" [value]="universityCode" [loading]="loadingUniversities"
      [placeholder]="universityPlaceholderKey | transloco"
      [allOptionLabel]="universityAllLabel ? (universityAllLabel | transloco) : null"
      (valueChange)="onUniversityChange($event)"></app-searchable-select>
  </div>

  <div class="form-group">
    <label class="form-label">{{ 'studyFields.course' | transloco }}</label>
    <app-searchable-select [options]="courseOptions" [value]="courseValue"
      [disabled]="!universityCode || loadingCourses || universityHasNoCourses" [loading]="loadingCourses"
      [placeholder]="(!universityCode ? 'studyFields.coursePlaceholderLocked'
        : loadingCourses ? 'common.loading'
        : universityHasNoCourses ? 'studyFields.noCoursesAvailable'
        : 'studyFields.coursePlaceholder') | transloco"
      [allOptionLabel]="courseAllLabel | transloco"
      (valueChange)="onCourseChange($event)"></app-searchable-select>
    @if (universityHasNoCourses) {
    <div class="form-text">{{ 'studyFields.noCoursesHint' | transloco }}</div>
    }
  </div>
</div>
