<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div
    class="toast align-items-center text-white border-0"
    role="alert"
    [class.show]="message"
    [class.hide]="!message"
    [ngClass]="{
      'bg-success': type === 'success',
      'bg-danger': type === 'error',
      'bg-warning': type === 'warning',
      'bg-info': type === 'info'
    }"
  >
    <div class="d-flex">
      <div class="toast-body">
        {{ message }}
        <button
          *ngIf="actionLabel"
          type="button"
          class="btn btn-link btn-sm text-white text-decoration-underline p-0 ms-2 align-baseline"
          (click)="triggerAction()"
        >{{ actionLabel }}</button>
      </div>
      <button
        type="button"
        class="btn-close btn-close-white me-2 m-auto"
        (click)="close()"
      ></button>
    </div>
  </div>
</div>
