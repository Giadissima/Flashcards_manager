server {
    listen 80;
    client_max_body_size 50M;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # Matched before the general /api/ block below: nginx buffers a proxied
    # response by default, which would sit on every SSE event until the
    # buffer filled instead of forwarding it straight away.
    location /api/notification/stream {
        proxy_pass http://server:3000/notification/stream;
        proxy_http_version 1.1;

        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # The connection is meant to sit open and idle between events, not
        # time out like an ordinary request.
        proxy_read_timeout 1d;
    }

    location /api/ {
        proxy_pass http://server:3000/;
        proxy_http_version 1.1;

        # Only the TCP handshake, not the response. With the API down, whether
        # this fails fast depends on getting an ICMP back: when the packets are
        # dropped instead, nginx would sit on its 60s default and the page would
        # spin for a minute before showing the error. Deliberately not touching
        # proxy_read_timeout: a slow but valid answer, such as the zip export,
        # has to be free to take its time.
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}