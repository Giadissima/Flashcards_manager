services:
  mongodb:
    image: mongo:8.0.9
    command: ["mongod", "--quiet"] # log solo di errori gravi
    container_name: mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    environment:
      # per fare inizializzare il db alla prima scrittura
      - MONGO_INITDB_DATABASE=flashcard_db

  server:
    build: ./server
    restart: unless-stopped
    container_name: flashcards_server
    ports:
      - "3000:3000"
    environment:
      - MONGO_URL=mongodb://mongodb:27017/flashcard_db
      - enableSwagger=true # per il development lasciare a true, altrimenti mettere a false
      - appName=Flashcards_Manager
      # Signs the login tokens: change it before going online, and every token
      # already handed out stops working - TODO
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_EXPIRES_IN=7d
      # The chat reports are announced in. Empty token = feature off, site
      # unchanged. The bot only sends; it listens to nothing.
      # The real values live in .env, which git ignores: a bot token in the
      # repository is a bot anybody can drive.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_API_URL=${TELEGRAM_API_URL:-https://api.telegram.org}
      # How many proxies really sit in front of the server, so the address the
      # rate limits count is the reader's. 0 = none; 1 = one reverse proxy;
      # 2 = Cloudflare and then it. Never guess high: see main.ts.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-0}
      # Where the site answers from, for the link the bot sends
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:4200}
    depends_on:
      - mongodb

  client:
    build: ./client
    restart: unless-stopped
    container_name: flashcards_client
    ports:
      - "4200:80"
    depends_on:
      - server

volumes:
  mongo_data:
